version: "v0.4"

project:
  name: "A decomposition theory for phylogenetic networks and incompatible characters"
  description: >-
    A Lean 4 formalization of Dan Gusfield, Vikas Bansal, Vineet Bafna and Yun S. Song (2007), "A
    decomposition theory for phylogenetic networks and incompatible characters", J. Comput. Biol. 14
    (2007), 1247-1272, with the sources that only it uses: Gusfield 1991, Gusfield, Eddhu, Langley
    2004, Myers, Griffiths 2003, Hudson, Kaplan 1985 and Song, Hein 2005. The paper treats
    phylogenetic networks with recombination. The formalization imports Mathlib, and from the
    library lean4-phylogenetics only the Splits Equivalence Theorem, whose modules import Mathlib
    only.


    Proved: the Decomposition Theorem for phylogenetic networks, the sufficient conditions for
    decomposability, and the refutation of all four Full-Decomposition Optimality Conjectures; every
    other numbered result but Theorem 4, which is false as printed and whose true form is proved in
    both directions; the sentences at lines 135, 156, 180, 299, 329, 381, 403, 411, 418, 420, 554,
    559, 590 and 608, Footnote 2, and the numbers of Figures 5-10. Of the sources, the Perfect
    Phylogeny Theorem, the galled-tree results of Gusfield, Eddhu, Langley 2004 with an algorithm
    proved correct, the haplotype bound and the integer program of Myers, Griffiths 2003, the bound
    of Hudson, Kaplan 1985 and the bound by ordered SPR of Song, Hein 2005.


    The audit records E42-E54 and E67 on the paper, including that Theorem 4 is false as printed,
    and E76-E79 and E85 on the sources.


    No result of the literature is assumed. No person has reviewed the proofs.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

