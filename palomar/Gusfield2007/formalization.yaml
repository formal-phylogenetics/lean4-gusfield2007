      framework: "Claude Code (VS Code extension)"
      tool_setup: "formalize-math-paper skill, repository vltanh/formalize-math-paper, commit e339f64 (the last round's log names no commit); Claude Code 2.1.314; 85 sub-agents, at most 11 at once, up to commit 282215c."
      cost:
        wall_time: "29.14 h elapsed, from 2026-10-31 to commit 282215c on 2026-11-01, including 1.67 h for the round that proved the assumed result, 3.36 h for the round that followed the sources and formalized what the papers say in passing, 8.34 h for the round of the two further papers, and 4.61 h for the round that finished what the papers claim; sub-agent work 76.8 h. The documents after that commit are not counted."
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links, continuing from the earlier handoff; later the user asked to match the sources closely, to formalize what the report listed as not formalized, to add Gusfield et al. 2007 and Allman et al. 2023 as primary papers on the library lean4-phylogenetics, and to finish what remained, leaving only empirical claims and wrong statements."
  spend_usd: "not tracked"
  notes: >-
    The user chose the papers and the versions of the first three, agreed to the statement
    corrections of ECToBlob and TOB-QMC, and decided the library's boundary, the layout, the kernels
    and publication. AI systems wrote the code, the statements, the audit and the documents. The
    automation above is for the whole of lean4-phylo-tree-of-blobs, with its other papers; this
    formalization was made there and moved to this repository on 2026-11-04. Gusfield2007/ is the
    library, and palomar/Gusfield2007/ has the Challenge and the Solution; the audit checks every
    declaration of this repository and of the library modules it imports, all on the standard
    axioms; three kernels accept the theorems of the Challenge (scripts/check_kernels.sh). See
    docs/Gusfield2007/CREDITS.md.

fidelity:
  divergences: >-
    Statements corrected (Sections 3, 4 and 6 of REPORT.md): Theorem 4, false as printed, proved with
    the entry node of a blob counted, with no site-free non-pendant arc that has both ends off the blobs, and two
    conventions (E42, E43, E44), and with the printed definition of efficient as an exact characterization; Theorem 10
    with the rooted count R_S(M), in each crossover model and with no hypothesis on the columns, as the paper's own use
    of R(M + S) at lines 525 and 560 suggests; if that symbol is read by the definition at line 385, the statement is
    false for single crossovers, and for multiple crossovers given a finite computation that the kernel hasn't completed
    (E50, E51); lines 156, 180, 373, 403, 554 and 560, false as printed, with their true forms (E45-E50, E67). The
    entry-node repair of Theorem 4 is in print, in Gusfield's 2014 book (E42). Library statements omit hypotheses that
    the proofs do not use (Section 5 of the report); the Challenge, palomar/Gusfield2007/Challenge.lean, keeps them. Readings: Section 6
    of the report. False claims found, not formalized as stated: Corollary 2.1 of Gusfield et al. 2004 in one direction
    (E76).


    Departures from the papers' proofs, every one with what the paper does, what Lean does and why, in Section 7 of the
    report. Repairing gaps or errors: Gusfield et al. 2004's general fact, by tracing states in place of deleting arcs,
    its Theorem 2.7, and its Section 8 on one fixed galled tree (E77); Gusfield et al. Lemma 4's other cases (line 295),
    Theorem 4 (E42-E44), line 373 (E45), line 156 (E46), line 403 as an implication between conjectures and the rooted
    refutation at line 590 (E48), lines 187-190 (the proof of Theorem 1, not its statement), line 264 (contracting the
    tree of the Perfect Phylogeny Theorem), line 418, computing F without Theorem 4, line 576 and Theorem 6 (E53),
    Theorem 10, by pairs of labels on two sites in place of visible nodes (E50, E51), line 299 at a central root (E53).
    Not forced, and documented: Myers and Griffiths' Algorithm 3 (a set of nodes of a network, in place of a history);
    Gusfield et al. 2004's algorithm (recombination points tried, one rule of cluster inclusion, a proof in place of the
    final check), its Corollary 5.1 (gluing in place of moving sites) and reduced galled trees (a threshold on a gall in
    place of its arrays); Gusfield et al. line 411 (re-rooting and Corollary 3: Bandelt et al. give the decomposition at
    cut nodes of the median network, neither paper writes its link to the components of G(M), which Dress et al. 2011
    state for Buneman graphs, and that route wasn't built, for its cost), line 299 (the root of T-bar at a row of M + S,
    which avoids a central root), and line 135 (all shared tops of blobs at once). No printed argument to follow, or a
    source not read: Gusfield et al. lines 329-330, the inflation in Theorem 1 (the paper gives no construction), line
    554; lower bounds on R for Figures 5 and 8 (the paper runs programs, Lean has a verified search); Gusfield 1991,
    Semple and Steel 2003 (not read: standard arguments). docs/Gusfield2007/route_differences.tsv records every difference of route.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review)"
  notes: >-
    Independent AI agents reviewed the statements against the sources and compared the formal proofs
    with the papers'; a separate agent checked the findings. The route check and the three kernels
    (scripts/check_kernels.sh: Lean's kernel, NanoDa, con-ron) ran locally; Comparator checks that
    the Solution proves exactly the statements of the Challenge,
    palomar/Gusfield2007/Challenge.lean, which imports only Mathlib and holds a copy of the
    definitions of Gusfield2007/Defs.lean.

