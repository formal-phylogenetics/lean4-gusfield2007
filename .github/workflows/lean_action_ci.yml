name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # The audit sees a module's proofs only through its own `import all` line: every module of
      # Gusfield2007/ (External/ and the paper's library) and the paper's Solution in palomar/, but
      # not the Challenge, which holds a copy of the definitions of Gusfield2007/Defs.lean. It also
      # imports the modules of the library Phylogenetics that the project uses.
      - name: Check that the audit imports every module of the libraries
        run: >-
          diff <({ find Gusfield2007 -name '*.lean'; cd palomar && find . -name Solution.lean; }
          | sed 's#^\./##; s/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^import all Gusfield2007\.' scripts/Audit.lean
          | sed 's/^import all //' | sort)
      - name: Audit axioms and dependencies
        run: lake env lean scripts/Audit.lean
      # The routes of the papers' proofs (docs/Gusfield2007/paper_routes.tsv) and the reviewed
      # differences (docs/Gusfield2007/route_differences.tsv).
      - name: Check that the proofs follow the routes of the papers' proofs
        run: >-
          python3 scripts/route_check.py check docs/Gusfield2007/paper_routes.tsv
          --accept docs/Gusfield2007/route_differences.tsv
      # The copy of Gusfield2007/Defs.lean in palomar/Gusfield2007/Challenge.lean.
      - name: Check that the Challenge's copy of the shared definitions is current
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check that the documentation's links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: >-
          python3 scripts/check_md_tables.py README.md
          docs/Gusfield2007/REPORT.md docs/Gusfield2007/CREDITS.md
